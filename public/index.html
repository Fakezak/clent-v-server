<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Notify Test</title>
  <!-- Use the official Socket.IO client from their CDN to ensure compatibility -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 24px; }
    button { padding: 8px 14px; margin: 4px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
    
    #toasts { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); }
    .toast { margin: 8px 0; padding: 12px 20px; border-radius: 8px; font-weight: bold; animation: fadein .2s; }
    .green_text { background: #0a7d32; color: #fff; }
    
    #error-box { background: #8b0000; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-family: monospace; }
    #log { background: #000; padding: 12px; border-radius: 8px; height: 200px; overflow: auto; font-family: monospace; font-size: 12px; border: 1px solid #333; }
    
    @keyframes fadein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <h2>🎮 Game Notify Test</h2>
  
  <!-- This will show connection errors directly on screen -->
  <div id="error-box"></div>

  <p>Socket ID: <code id="sid">connecting...</code></p>
  <button onclick="login()">Send Login Event</button>

  <div id="toasts"></div>
  
  <h3>Message Log</h3>
  <div id="log"></div>

  <script>
    const log = (msg) => {
      const el = document.getElementById("log");
      el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
      el.scrollTop = el.scrollHeight;
    };

    const showError = (msg) => {
      const el = document.getElementById("error-box");
      el.style.display = "block";
      el.innerHTML = `<strong>Connection Error:</strong><br>${msg}`;
    };

    // Connect using the specific Vercel path and force WebSocket
    const socket = io('/', {
      path: '/api/socket/socket.io',
      transports: ['websocket'],
    });

    socket.on("connect", () => {
      document.getElementById("sid").textContent = socket.id;
      document.getElementById("error-box").style.display = "none"; // hide error if it connects
      log(`Connected successfully as ${socket.id}`);
    });

    socket.on("connect_error", (err) => {
      log(`Connect error: ${err.message}`);
      showError(err.message + "<br><br><em>Check your GitHub repo to ensure api/socket.js uses `module.exports` or your package.json has `"type": "module"`.</em>");
    });

    socket.on("disconnect", (reason) => {
      log(`Disconnected: ${reason}`);
    });

    socket.on("system_notification", (msg) => {
      log(`Received: ${JSON.stringify(msg)}`);

      // Render the green toast
      const el = document.createElement("div");
      el.className = `toast ${msg.display_style}`;
      el.textContent = msg.content;
      document.getElementById("toasts").appendChild(el);
      
      // Remove after duration
      setTimeout(() => el.remove(), msg.duration || 5000);
    });

    function login() {
      if (!socket.connected) {
        showError("Cannot send login. Socket is not connected yet.");
        return;
      }
      log("Sending 'player_ready' event...");
      socket.emit("player_ready");
    }
  </script>
</body>
</html>
